<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT Fundamentals Flashcards</title>
<style>
  :root { --blue:#1a73e8; --green:#188038; --amber:#e37400; --bg:#f1f3f4; --card:#ffffff; --ink:#202124; }
  * { box-sizing:border-box; margin:0; padding:0; font-family:'Segoe UI', system-ui, sans-serif; }
  body { background:var(--bg); color:var(--ink); min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px 12px 40px; }
  h1 { font-size:1.4rem; margin-bottom:4px; }
  .sub { color:#5f6368; font-size:.9rem; margin-bottom:16px; text-align:center; }
  .tabs { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; justify-content:center; }
  .tab { border:1px solid #dadce0; background:#fff; padding:8px 16px; border-radius:20px; cursor:pointer; font-size:.9rem; font-weight:600; color:#5f6368; }
  .tab.active { background:var(--blue); color:#fff; border-color:var(--blue); }
  .counter { font-size:.85rem; color:#5f6368; margin-bottom:10px; }
  .cardwrap { perspective:1200px; width:100%; max-width:560px; }
  .card { position:relative; width:100%; min-height:340px; cursor:pointer; transform-style:preserve-3d; transition:transform .45s; }
  .card.flipped { transform:rotateY(180deg); }
  .face { position:absolute; inset:0; backface-visibility:hidden; background:var(--card); border-radius:16px; box-shadow:0 2px 10px rgba(0,0,0,.15); padding:30px 22px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; overflow-y:auto; }
  .face .tag { position:absolute; top:12px; left:16px; font-size:.7rem; font-weight:700; letter-spacing:.5px; color:#fff; background:var(--blue); padding:3px 10px; border-radius:10px; }
  .face.back { transform:rotateY(180deg); background:#e8f0fe; }
  .face .hint { position:absolute; bottom:10px; font-size:.72rem; color:#9aa0a6; }
  .q { font-size:1.12rem; font-weight:600; line-height:1.45; }
  .a { font-size:.95rem; line-height:1.5; white-space:pre-line; }
  .controls { display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; justify-content:center; }
  button.ctl { border:none; border-radius:8px; padding:12px 18px; font-size:.95rem; font-weight:600; cursor:pointer; color:#fff; }
  .prev,.next { background:#5f6368; }
  .know { background:var(--green); }
  .review { background:var(--amber); }
  .shuffle { background:var(--blue); }
  .stats { margin-top:14px; font-size:.85rem; color:#5f6368; }
  .stats b.g { color:var(--green); } .stats b.a { color:var(--amber); }
  .done { margin-top:16px; background:#e6f4ea; border:1px solid #188038; color:#188038; padding:12px 18px; border-radius:10px; font-weight:600; display:none; text-align:center; }
</style>
</head>
<body>
  <h1>IT Fundamentals Flashcards</h1>
  <div class="sub">Hardware · Networking · Linux · Ticketing — tap a card to flip. Answer OUT LOUD before flipping.</div>
  <div class="tabs" id="tabs"></div>
  <div class="counter" id="counter"></div>
  <div class="cardwrap">
    <div class="card" id="card" onclick="this.classList.toggle('flipped')">
      <div class="face front"><span class="tag" id="tagF"></span><div class="q" id="qtext"></div><span class="hint">tap to flip</span></div>
      <div class="face back"><span class="tag" id="tagB"></span><div class="a" id="atext"></div><span class="hint">tap to flip back</span></div>
    </div>
  </div>
  <div class="controls">
    <button class="ctl prev" onclick="move(-1)">&#8592; Prev</button>
    <button class="ctl review" onclick="mark(false)">Review again</button>
    <button class="ctl know" onclick="mark(true)">Got it &#10003;</button>
    <button class="ctl next" onclick="move(1)">Next &#8594;</button>
  </div>
  <div class="controls"><button class="ctl shuffle" onclick="shuffleDeck()">Shuffle deck</button></div>
  <div class="stats" id="stats"></div>
  <div class="done" id="done">Deck cleared — every card marked "Got it." Run it again tomorrow.</div>

<script>
const CARDS = [
// ---------- DAY 1: FOUNDATIONS ----------
["Day 1","RAM vs. storage — what's the difference?","RAM = the countertop: fast workspace, WIPED when power is lost.\nStorage (HDD/SSD) = the pantry: keeps everything with power off.\n\n🧠 Hook: countertop clears every night; pantry keeps the food."],
["Day 1","What is ECC RAM and why do servers use it?","Error-Correcting Code memory. It catches and FIXES tiny bit-flips on its own, and logs each fix.\n\nServers use it because a silent 1-bit error in a bank record or medical file is a disaster.\n\n🧠 Hook: ECC = spell-check for memory."],
["Day 1","RAID 0 — what does it do, and its weakness?","Splits (stripes) data across drives = SPEED only.\nAny one drive dies → ALL data gone.\n\n🧠 Hook: RAID ZERO = ZERO drives may fail, ZERO safety."],
["Day 1","RAID 1 — how does it work?","Mirror: two drives, identical copies. One dies, the twin has everything. You give up half your space for safety.\n\n🧠 Hook: RAID ONE = ONE perfect twin."],
["Day 1","RAID 5 — how does it work?","3+ drives holding data + PARITY (recovery math) spread across all of them. Any ONE drive can die — the array rebuilds it from parity.\n\n🧠 Hook: RAID 5 = the team with a shared cheat sheet."],
["Day 1","RAID 6 vs RAID 5?","RAID 6 = RAID 5 with DOUBLE parity → survives TWO dead drives.\nExists because big-drive rebuilds take so long that a second drive often dies mid-rebuild.\n\n🧠 Hook: 6 = 5 + one more funeral covered."],
["Day 1","RAID 10 — what is it and when is it used?","Mirrored pairs (1), striped together (0). Fast AND safe; costs half your space. Databases love it.\n\n🧠 Hook: 10 = 1 + 0: mirror first, then speed."],
["Day 1","What is parity, in plain English?","Recovery math. If you know 3 + X = 7, you can rebuild X.\nParity is the extra info that lets the array recompute a dead drive's data.\n\n🧠 Hook: parity = the '7' in 3 + X = 7."],
["Day 1","A drive fails in RAID 5 — what happens and what do you do?","Array keeps running but DEGRADED (safety margin gone, often slower).\n\nDo: verify WHICH drive → hot-swap it promptly → array REBUILDS from parity → monitor until done (data's at risk until rebuild finishes) → document.\n\n🧠 Hook: degraded = driving without a spare tire."],
["Day 1","What does DHCP do?","Auto-hands out IP addresses (plus gateway + DNS info) when a device joins the network. No DHCP = typing addresses by hand.\n\n🧠 Hook: DHCP = the host at the door: 'Welcome! Here's your table number.'"],
["Day 1","What does DNS do?","The internet's phone book: turns names (google.com) into IP addresses.\n\nIf ping-by-NUMBER works but names fail → DNS is broken.\n\n🧠 Hook: DNS = Directory, Not Signal."],
["Day 1","IP address vs MAC address?","IP = your current street address — changes when you move, handed out by DHCP (Layer 3).\nMAC = your fingerprint — burned into the NIC forever (Layer 2).\n\n🧠 Hook: IP = where you ARE; MAC = who you ARE."],
["Day 1","Switch vs router?","Switch = mailroom: moves messages INSIDE one building (one network, uses MACs).\nRouter = post office: moves messages BETWEEN buildings (between networks, uses IPs).\n\n🧠 Hook: SWitch = SaMe network; ROuter = ROams out."],
["Day 1","What is a default gateway?","Your router's address — the one door traffic uses to LEAVE your network.\n\nSymptom of a bad gateway: local stuff works, internet doesn't.\n\n🧠 Hook: gateway = the exit door."],
["Day 1","A server is healthy but doesn't answer ping — how?","A firewall rule can block ICMP (ping) while every real service works fine.\n\nLesson: no ping ≠ machine down. Check a real port/service too.\n\n🧠 Hook: the bouncer ignores knocks but lets ticket-holders in. (You BUILT this rule in your pfSense lab.)"],
["Day 1","What is POST?","Power-On Self-Test: at power-up the machine checks its own parts (CPU? RAM? video?) BEFORE loading the OS. Failures come out as beep codes or LED patterns.\n\n🧠 Hook: POST = the machine's morning stretch — it groans (beeps) where it hurts."],
["Day 1","What is ESD and how do you protect against it?","Electrostatic discharge — the doorknob zap. Too small to feel can still kill a chip SILENTLY.\n\nProtect: grounded wrist strap, touch bare case metal, hold boards by EDGES, never touch gold contacts.\n\n🧠 Hook: the zap you can't feel is the one that kills."],
["Day 1","What does hot-swap mean?","Replacing a part (drive, PSU, fan) WHILE the server keeps running — no shutdown. Daily data center work.\n\n🧠 Hook: changing a tire while the car keeps driving."],
["Day 1","Why do servers have TWO power supplies?","Redundancy. Each PSU feeds from a DIFFERENT power path (A feed / B feed), so one PSU — or one whole circuit — can die with zero downtime.\n\n🧠 Hook: two parachutes, packed by different people."],
["Day 1","HDD vs SSD vs NVMe?","HDD: spinning platters — cheap, big, slow, dies mechanically (clicking).\nSSD: chips — fast, silent, no moving parts.\nNVMe: an SSD that skips the old connector and rides PCIe lanes straight to the CPU — fastest.\n\n🧠 Hook: HDD = record player · SSD = USB stick on steroids · NVMe = SSD with a highway pass."],
["Day 1","Recite the 6-step troubleshooting order.","1) SYMPTOMS — what exactly is broken, what changed?\n2) PHYSICAL first — power, cables, LEDs\n3) ISOLATE — change ONE thing at a time\n4) TEST after each change\n5) DOCUMENT everything\n6) ESCALATE with notes when it's beyond you\n\n🧠 Hook: 'So PleaseItemize The Damn Evidence.'"],
["Day 1","The magic sentence when you don't know an answer?","\"I don't know that off the top of my head, but here's how I'd find out\" — then NAME the step: check the logs, check the runbook/KB, ask a senior tech.\n\n🧠 Why it works: guessing confidently is the red flag; knowing how to find out is the job."],
// ---------- DAY 2: HARDWARE DEEP DIVE ----------
["Day 2","RDIMM vs UDIMM?","RDIMM = Registered (buffered) server memory — a small chip steadies the signal so a board can run MANY sticks reliably.\nUDIMM = Unbuffered — normal desktop RAM.\n\n🧠 Hook: R = Registered = Rack (server); U = Unbuffered = yoUr PC."],
["Day 2","Can you put DDR4 in a DDR5 slot?","No — every DDR generation has its notch in a different place, so it physically won't seat.\n\nField rule: if a stick won't go in, STOP PUSHING and check compatibility.\n\n🧠 Hook: the notch is the bouncer."],
["Day 2","Logs show rising corrected memory errors on one DIMM. Action?","That stick is dying in slow motion. ECC is fixing errors NOW, but the trend line says replace it BEFORE it crashes the host.\n\nPlan the swap, don't ignore it.\n\n🧠 Hook: corrected errors = smoke; wait long enough and you get fire."],
["Day 2","Steps to reseat a RAM stick safely?","1) Power off + unplug\n2) Hold power button 5 sec (drain)\n3) ESD strap on\n4) Open BOTH side clips\n5) Pull straight up, hold by EDGES\n6) Align the notch, press evenly until BOTH clips CLICK\n\n🧠 Hook: two clicks or it didn't happen."],
["Day 2","SATA vs SAS vs NVMe?","SATA: the standard lane — fine for HDDs, caps ~550 MB/s.\nSAS: the enterprise lane — faster, more reliable, many drives per controller, dual-ported.\nNVMe: no lane at all — rides PCIe straight to the CPU.\n\n🧠 Hook: SATA = street, SAS = Serious-About-Servers, NVMe = highway."],
["Day 2","What is SMART data?","The drive's own health report card: reallocated sectors, wear level, error counts.\n\nTechs read SMART to catch a failing drive BEFORE it dies.\n\n🧠 Hook: SMART = the drive's Fitbit."],
["Day 2","Walk through replacing a failed drive in a hot-swap bay.","1) Confirm WHICH bay (amber LED + management console — never trust the LED alone)\n2) Verify the array can survive the pull\n3) Pull the RIGHT drive\n4) Insert replacement, confirm rebuild starts\n5) Monitor rebuild to completion\n6) Update and close the ticket\n\n🧠 Hook: verify twice, pull once."],
["Day 2","What happens if you pull the WRONG drive from a degraded RAID 5?","You just killed the second drive of an array that could only lose one → the ENTIRE array dies. Total data loss.\n\nThat's why 'verify before you pull' is THE answer they want to hear.\n\n🧠 Hook: degraded RAID 5 is a bomb with one wire left."],
["Day 2","What is a hot spare?","An idle drive already sitting in the chassis. The RAID controller grabs it AUTOMATICALLY the second a drive dies and rebuilds onto it — shrinking the danger window to minutes instead of 'whenever a human shows up.'\n\n🧠 Hook: the understudy already in costume."],
["Day 2","Why is RAID not a backup?","RAID survives DRIVE failure only. It happily replicates your mistakes: deletion, corruption, ransomware — mirrored instantly. And it can't survive fire/flood.\nBackups = separate copies, elsewhere, in time.\n\n🧠 Hook: RAID copies your errors faithfully; backups remember life before them."],
["Day 2","Describe the data center power path.","Grid → building switchgear → UPS (batteries: carry the load for MINUTES) → rack PDU (industrial power strip) → server PSUs.\nGenerators start in seconds and take over from the UPS. Dual PSUs ride separate A/B feeds.\n\n🧠 Hook: Grid → Switch → Battery → Strip → Supply. 'GSBSS: Good Servers Beat Sudden Shutdowns.'"],
["Day 2","One PSU shows amber but the server is up. Urgent?","Server's fine on the survivor — but redundancy is GONE. One more failure = downtime.\n\nAnswer: hot-swap the failed PSU promptly (no shutdown needed). Not an emergency; not a someday.\n\n🧠 Hook: you're flying on one engine — land soon, not eventually."],
["Day 2","Server won't boot, no video, beep code. First move?","Beep codes usually = RAM.\nReseat the sticks → then ONE-STICK TEST (boot with a single stick, rotate) to find the bad one.\n\n🧠 Hook: when it beeps, reseat and repeat."],
["Day 2","Total mystery no-boot — what's the isolation method?","MINIMUM CONFIG: strip to CPU + 1 DIMM + PSU. Confirm it POSTs.\nAdd parts back ONE at a time. When it breaks, the LAST part you added is the culprit.\n\n🧠 Hook: rebuild the suspect lineup one at a time."],
["Day 2","What is a BMC (iDRAC/iLO)?","A tiny always-on management computer inside the server with its OWN network port.\nLets you see the console, power-cycle, and read hardware logs remotely EVEN IF the OS is dead.\n\n🧠 Hook: the black box + remote control that works when the plane is down. (Dell = iDRAC, HP = iLO)"],
["Day 2","Server 'got slow' and it's hot. What's happening?","THERMAL THROTTLING: an overheating CPU deliberately slows itself to survive.\nCheck: dead fans, dust, blocked airflow, dried thermal paste, hot-aisle leakage.\n\n🧠 Hook: a runner in a heatwave slows down before collapsing. Fans are a top-replaced part."],
["Day 2","Why do empty rack slots get blanking panels?","They stop HOT exhaust air from looping back around into the cold aisle. Gaps = recirculation = hot spots = throttling servers.\n\n🧠 Hook: an open slot is a hole in the wall between summer and winter."],
["Day 2","Recite the T568B wire order, pins 1–8.","Orange-white, Orange, Green-white, BLUE, Blue-white, GREEN, Brown-white, Brown.\n\nPattern: pairs go white-then-solid EXCEPT green splits around blue.\nT568A = same but swap orange↔green.\n\n🧠 Hook: 'Orange you Glad Blue Genes are Brown' — and green gets SPLIT by blue."],
["Day 2","Straight-through vs crossover cable?","Straight-through: SAME standard both ends (B–B) — device to switch, the normal case.\nCrossover: A one end, B the other — old-school direct PC-to-PC.\n\n🧠 Hook: crossover = the wires literally cross so two 'talkers' can hear each other."],
["Day 2","CAT5e vs CAT6, and the copper distance limit?","CAT5e = 1 Gbps · CAT6/6a = up to 10 Gbps · both max ~100 METERS per run.\nPast 100m you need a switch in between — or fiber.\n\n🧠 Hook: copper runs a 100m dash, then needs a relay partner."],
["Day 2","Name four field-tech habits to weave into ANY hands-on answer.","1) Verify asset tag matches the ticket BEFORE touching\n2) ESD strap on\n3) One change at a time, test after each\n4) Label what you unplug; document; close only when verified\n\n🧠 Hook: Tag → Strap → One → Log."],
// ---------- DAY 2: FIBER ----------
["Day 2","How does a fiber optic cable actually work?","Pulses of LIGHT travel through a hair-thin glass core. The cladding around the core has a different refractive index, so light hitting the wall reflects back INWARD (total internal reflection) and bounces along for km.\n\nNo electrical interference, huge bandwidth.\n\n🧠 Hook: a hallway of perfect mirrors."],
["Day 2","Single-mode vs multi-mode fiber?","MULTI-mode: fat 50µm core, light takes MANY bouncing paths, short range (~400–550m), aqua/orange jacket → INSIDE buildings.\nSINGLE-mode: tiny 9µm core, ONE straight laser path, tens of km, yellow jacket → BETWEEN buildings.\n\n🧠 Hook: single = straight = far. Yellow = yonder."],
["Day 2","What is a transceiver (SFP/QSFP)?","The plug-in module that converts electricity ↔ light. The fiber itself is dumb glass — the transceiver is the brains.\nSFP+ = 10G, QSFP28 = 100G. Hot-swappable, and a classic 'link down' culprit — often faster to swap than diagnose.\n\n🧠 Hook: the fiber is the road; the transceiver is the car."],
["Day 2","Name the common fiber connectors.","LC — small square, THE data center standard, used in duplex pairs (one strand transmits, one receives).\nSC — older, chunkier.\nMPO/MTP — ribbon plug carrying 8–24 strands for 40G/100G+ trunks.\n\n🧠 Hook: LC = Little Connector, SC = Sizeable Connector, MPO = Many Ports, One plug."],
["Day 2","Fiber handling rules — name four.","1) Respect minimum BEND RADIUS — sharp bends leak light or crack glass\n2) DUST CAPS stay on until the moment you plug in\n3) CLEAN every end-face before every connection (dirt = #1 mystery fault)\n4) NEVER look into a live fiber — invisible laser light, eye damage\n\n🧠 Hook: Bend, Cap, Clean, Don't-Look."],
["Day 2","Fiber link is down — your troubleshooting order?","1) Reseat the transceiver\n2) Check TX/RX not swapped — flip the LC pair\n3) Clean both end-faces\n4) Swap transceiver\n5) Swap patch cable\n6) Escalate to the trunk/pathway\n\n🧠 Hook: Seat → Flip → Clean → Swap → Swap → Shout. One change at a time."],
["Day 2","What is an OTDR?","Optical Time-Domain Reflectometer — fires light down the fiber and reads the reflections to tell you WHERE (by distance) the break or loss is.\n\n🧠 Hook: sonar for glass."],
// ---------- DAY 3: NETWORKING DEEP DIVE ----------
["Day 3","Name OSI layers 1–4 and 7 with an example each.","L1 Physical — cables, light, link LEDs\nL2 Data Link — MAC addresses, switches\nL3 Network — IP addresses, routers\nL4 Transport — TCP/UDP\nL7 Application — HTTP, DNS\n\nTroubleshoot BOTTOM-UP: cable before blame.\n\n🧠 Hook: 'Please Do Not Throw ... Away' (Physical, Data link, Network, Transport ... Application)."],
["Day 3","TCP vs UDP?","TCP = certified mail: connection, delivery confirmed, order guaranteed (web, SSH, email).\nUDP = shouting across the room: fast, no guarantees (video, DNS lookups, games).\n\n🧠 Hook: TCP = Takes Care of Packets. UDP = U Didn't get it? oh well, Proceed."],
["Day 3","Ports: SSH, DNS, HTTP, HTTPS, DHCP?","SSH = 22 · DNS = 53 · HTTP = 80 · HTTPS = 443 · DHCP = 67 (server) / 68 (client)\n\n🧠 Hooks: SSH 22 — 'two-two, secure crew.' DNS 53 — Herbie the phone-book Beetle. 80 → 443: the web grew up and got armored."],
["Day 3","Describe the DHCP handshake (DORA).","D-iscover: client broadcasts 'any DHCP servers out there?'\nO-ffer: server offers an IP\nR-equest: client says 'I'll take that one'\nA-cknowledge: server confirms the lease\n\n🧠 Hook: DORA the Explorer finds your address."],
["Day 3","What happens when you type a website name in a browser (DNS walk)?","1) Check local cache\n2) Ask your DNS resolver\n3) Resolver walks: root servers → .com servers → the site's own (authoritative) server\n4) IP comes back, browser connects to it\n\n🧠 Hook: ask the family → the librarian → the phone company → the person themselves."],
["Day 3","What is ARP?","Address Resolution Protocol — on the LOCAL network it answers: 'who has IP 192.168.1.1? Tell me your MAC.'\nIt's the bridge from Layer 3 (IP) to Layer 2 (MAC). See the table with arp -a.\n\n🧠 Hook: ARP = 'A-yo, who's at this address, Really? Prove it.'"],
["Day 3","How many usable hosts in a /24? A /16?","/24 → 254 usable (256 minus network + broadcast addresses)\n/16 → 65,534 usable\n\n🧠 Hook: /24 = one apartment building (254 doors); /16 = a whole city."],
["Day 3","Name the three private IP ranges.","10.0.0.0/8 · 172.16–172.31.x.x · 192.168.x.x\nNot routable on the public internet — NAT translates them on the way out.\n\n🧠 Hook: 10 fingers, 172 is the weird middle child, 192.168 is every home router you've ever met."],
["Day 3","A machine's IP starts with 169.254.x.x — what does that tell you?","APIPA — the machine ASKED for DHCP and got SILENCE, so it made up its own useless address.\nCheck: cable/link first, then whether DHCP is reachable/alive.\n\n🧠 Hook: 169 = 'I gave up and named myself.'"],
["Day 3","You can ping 8.8.8.8 but google.com fails. Diagnosis?","Connectivity is FINE (numbers work) — NAME resolution is broken → DNS problem.\nCheck DNS settings, test with nslookup.\n\n🧠 Hook: you can drive to the house; you just lost the phone book."],
["Day 3","You can ping local machines but nothing outside. Diagnosis?","The neighborhood works; the EXIT is broken → default gateway wrong/missing, or the router itself is down.\n\n🧠 Hook: all the hallway doors open; the front door is locked."],
["Day 3","What is 127.0.0.1?","Loopback — the machine calling itself. ping 127.0.0.1 proves the TCP/IP stack works WITHOUT touching the network.\n\n🧠 Hook: 'there's no place like 127.0.0.1' (there's no place like home)."],
["Day 3","What do a switch port's link lights tell you?","OFF = no physical link (cable/NIC/port dead)\nSOLID = link established\nBLINKING = traffic flowing\nFirst thing to check — it's Layer 1 truth at a glance.\n\n🧠 Hook: dead, alive, talking."],
["Day 3","What is a duplex/speed mismatch?","The two ends of a link auto-negotiate DIFFERENT speed or duplex settings. Link comes up but crawls, with errors/collisions.\nSymptom: 'connected but horribly slow.'\n\n🧠 Hook: one side whispers, the other side talks over them."],
["Day 3","What is a VLAN?","A Virtual LAN — one physical switch logically sliced into separate networks. Different VLANs can't talk without a router, even on the same switch.\nSegmentation without buying more hardware.\n\n🧠 Hook: one office building, keycard-locked floors."],
["Day 3","What is NAT?","Network Address Translation — the router rewrites private inside addresses to its one public IP on the way out (and tracks each session to route replies back).\nWhole network shares one public address.\n\n🧠 Hook: the receptionist: 100 employees, one phone number."],
["Day 3","Your CLI toolkit for 'no network' — 5 commands and their jobs.","ping — is it reachable?\ntraceroute/tracert — WHERE does the path break?\nipconfig / ip addr — what's MY IP/gateway/DNS?\nnslookup — is DNS resolving?\narp -a — IP-to-MAC table on the LAN\n\n🧠 Hook: Reach, Route, Me, Names, Neighbors."],
["Day 3","How does a switch know where to send frames?","It LEARNS: every incoming frame's source MAC + port gets written into its MAC table. Future frames to that MAC go only to that port; unknown MACs get flooded everywhere.\n\n🧠 Hook: a mailroom clerk who memorizes who sits where by watching outgoing mail."],
// ---------- DAY 4: INTERVIEW BANK ----------
["Day 4","What protocol does ping use? (trap question)","ICMP — Internet Control Message Protocol.\nNOT TCP. NOT UDP. That's the trap — ICMP is its own protocol beside them.\nPing = ICMP echo request → echo reply, timed.\n\n🧠 Hook: 'I Can't Miss Ping.'"],
["Day 4","Rapid-fire ports: HTTP, HTTPS, SSH, DNS, DHCP.","HTTP 80 · HTTPS 443 · SSH 22 · DNS 53 · DHCP 67/68\n\nSay them in under 5 seconds. Then again.\n\n🧠 Hook: 80 grew armor → 443. Two-two secure crew. 53 phone book. 67/68 = the address desk next door."],
["Day 4","Subnet masks for Class A, B, C?","A = 255.0.0.0 (/8)\nB = 255.255.0.0 (/16)\nC = 255.255.255.0 (/24)\n\n🧠 Hook: A-B-C = one-two-three 255s."],
["Day 4","Name every component in a PC — then what a server changes.","PC: case, motherboard, PSU, CPU, RAM, storage, fans, NIC, graphics.\nServer: DUAL CPUs · ECC RDIMMs · DUAL hot-swap PSUs · drive backplane + RAID controller · extra NICs · BMC (iDRAC/iLO) · rack chassis · no GPU needed.\n\n🧠 Hook: a server is a PC that doubled everything that can die and added a remote control."],
["Day 4","How do you spot a dead hard drive WITHOUT software or pulling it?","LISTEN — clicking = heads striking (the 'click of death')\nLOOK — amber fault LED on the bay or controller\nFEEL — no spin-up vibration at power-on\nThen confirm in the management console / SMART.\n\n🧠 Hook: ears, eyes, fingertips — then the console."],
["Day 4","BIOS vs UEFI — what are they and what does a tech do in there?","Firmware that wakes the hardware, runs POST, then hands off to the OS.\nUEFI = the modern one: faster, huge disks, Secure Boot.\nTech uses it for: boot order (disk vs PXE), checking all RAM/CPUs are DETECTED, firmware updates, fan/temp readings.\n\n🧠 Hook: the building superintendent who opens up before the tenants (OS) arrive."],
["Day 4","Linux rapid-fire: first disk, boot messages, logs, permanent mounts, kernel version.","First disk: /dev/sda (NVMe: /dev/nvme0n1)\nBoot messages: dmesg\nLogs: /var/log\nMount every boot: /etc/fstab\nKernel: uname -r\n\n🧠 Hook: sda-dmesg-varlog-fstab-uname — chant it like an address."],
["Day 4","Make a filesystem; install an OS on hundreds of machines.","mkfs.ext4 /dev/sda1 — formats partition 1 of disk sda.\nMass install = PXE BOOT: machines boot from the network and pull an image from a server. Fleets are imaged, never hand-installed.\n\n🧠 Hook: PXE = 'Pixie dust' — machines wake up already dressed."],
["Day 4","THE scenario: 100 broken computers — how do you proceed?","DON'T touch 100 machines. Think shared-cause first:\n1) What do they SHARE? (rack, row, time, model, patch)\n2) Check shared infra FIRST — one bad switch/PDU = 100 'broken' machines\n3) GROUP by symptom — maybe it's 3 problems, not 100\n4) Correlate with events (deploy? power blip?)\n5) Deep-dive ONE machine per group (BMC console, logs)\n6) Fix root cause → verify a sample → sweep → document\n\n🧠 Hook: Share → Group → Sample → Sweep."],
["Day 4","Playbook: server has NO power at all.","1) Is the outlet/PDU port live? (test with known-good device)\n2) Power cable seated BOTH ends?\n3) PSU rocker switch on? PSU status LED?\n4) Swap in a known-good cable\n5) Reseat/swap the PSU — dual-PSU: check BOTH A and B feeds\n6) Still dead → board/power-distribution → escalate WITH notes\n\n🧠 Hook: walk the power path outside-in: wall → cord → supply → board."],
["Day 4","Playbook: powers on but no POST / no video.","1) Read the beeps / diagnostic LEDs / BMC event log — the machine is TELLING you\n2) Reseat RAM; one-stick test\n3) Reseat 24-pin + 8-pin CPU power\n4) Strip to minimum config: CPU + 1 DIMM + PSU\n5) Add parts back one at a time — last one added is the culprit\n\n🧠 Hook: listen, reseat, strip, rebuild."],
["Day 4","Playbook: 'No boot device found.'","1) Boot order right in BIOS?\n2) Is the drive even DETECTED (BIOS / RAID controller)?\n3) Bay LED amber? Array degraded or failed?\n4) Reseat drive/cable\nUsually a dead drive or controller issue — PROVE the hardware before touching software.\n\n🧠 Hook: can't boot from a drive the machine can't see."],
["Day 4","Playbook: random crashes / blue screens — prime suspects?","1) RAM — run memtest86 (bootable memory hammer)\n2) HEAT — fans, dust, thermal paste\n3) PSU sagging under load\n4) Dying drive — check SMART\nChange ONE variable at a time.\n\n🧠 Hook: Memory, Heat, Power, Disk — 'My Hardware's Probably Dying.'"],
["Day 4","What's a CMOS battery and what happens when it dies?","The coin cell on the motherboard that keeps BIOS settings + the clock alive with power off.\nWhen it dies: settings 'forgotten,' clock resets to 2000-something, weird boot complaints.\nClassic sneaky culprit — costs $3.\n\n🧠 Hook: the building's memory keeper on a watch battery."],
["Day 4","What are VRMs and PCIe lanes?","VRMs: rows of voltage regulators by the CPU socket converting PSU power to the CPU's precise voltage. They run HOT — that's why they wear heatsinks.\nPCIe lanes: the bandwidth channels of expansion slots — x1/x4/x8/x16. NVMe drives, NICs, GPUs all ride PCIe.\n\n🧠 Hook: VRM = the CPU's personal chef, portioning power exactly. Lanes = highway width."],
["Day 4","Server sees only 64GB of its 128GB RAM. First moves?","1) BIOS/BMC: WHICH DIMMs are detected, which are missing?\n2) Power down, ESD strap, reseat the missing sticks\n3) Check slot population order against the board manual\n4) Test the suspect stick in a known-good slot (stick vs slot?)\n\n🧠 Hook: find who's absent, re-sit them, check the seating chart, swap desks."],
["Day 4","Data destruction & chain of custody — why does it matter so much?","Every drive that leaves a server holds data. Policy: track EVERY drive by serial, secure it immediately, follow exact wipe/destroy procedure, document every handoff.\nA 'lost' drive is a data breach — this is one of the most disciplined parts of the job.\n\n🧠 Hook: treat every pulled drive like evidence in a trial — chain of custody, signed at every step."],
["Day 4","Hot aisle / cold aisle — explain the layout and why it exists.","Server FRONTS face each other across the COLD aisle (chilled air in); BACKS face each other across the HOT aisle (exhaust out). Never mix them — separation is what makes cooling efficient.\nTechs work in both; hot aisle work = hydrate, pace yourself.\n\n🧠 Hook: faces drink cold air; backs exhale hot — like rows of people at a fountain."],
["Day 4","Safe lifting and physical safety on the floor.","Bend at the KNEES, back straight; get a TEAM LIFT or server lift for heavy gear (the JD says 50 lb, servers can be more).\nESD strap for components, closed shoes, no loose items over racks, hydrate on hot-aisle work.\nSaying this UNPROMPTED in answers scores points.\n\n🧠 Hook: knees save backs; lifts save careers."],
["Day 4","The five domains interviews score you on.","1) POWER — the path, redundancy, PSUs\n2) THERMAL — airflow, throttling, containment\n3) NETWORK — cables, links, IP basics\n4) SAFETY — ESD, lifting, procedures\n5) OPERATIONAL DISCIPLINE — tickets, docs, escalation, uptime mindset\nTouch the relevant domain in every answer.\n\n🧠 Hook: P-T-N-S-O: 'Please Take Notes, Stay Organized.'"],
["Day 4","What's the actual job, in one sentence you could say out loud?","\"Deploy and repair server, network, and storage hardware; respond to tickets from monitoring; follow procedures exactly — especially around safety and data handling; document everything; and escalate with good notes when it's beyond my tier.\"\n\n🧠 Practice saying this smoothly — it's your 'do you understand the role?' proof."],
// ---------- TICKETS ----------
["Tickets","What is a ticket, and what's Rule #1 of ticketing?","One problem, one record, one owner. Every action taken gets logged in it.\nRule #1: IF IT ISN'T IN THE TICKET, IT DIDN'T HAPPEN.\n\n🧠 Hook: the ticket is the story; unwritten work is fiction."],
["Tickets","Walk through the life of a ticket.","INTAKE (user, monitoring alert, or tech's own eyes)\n→ TRIAGE (priority)\n→ ASSIGN (one owner)\n→ DIAGNOSE & ACT (log as you go)\n→ ESCALATE or RESOLVE\n→ VERIFY the fix → document root cause → CLOSE\n\n🧠 Hook: In-Tri-As-Di-Es-Ver-Close — birth to funeral, all on record."],
["Tickets","How is ticket priority set?","IMPACT (how many users/systems hurt) × URGENCY (how time-critical).\nBoth high = P1.\nDown cluster > down server > dead redundant PSU.\n\n🧠 Hook: how BIG × how NOW."],
["Tickets","What do Tier 1, 2, and 3 support do?","T1: first contact, known fixes, route it\nT2: hands-on technical work — swaps, reseats, diagnostics (the technician tier)\nT3: engineers/specialists — firmware, design flaws, vendors\n\n🧠 Hook: T1 answers, T2 wrenches, T3 engineers."],
["Tickets","What makes a GOOD escalation?","Escalating WITH your notes: symptoms, what you tried, what you ruled out — so the next tier starts where you stopped, not from zero.\nThe sin isn't escalating — it's escalating empty-handed, or sitting on a P1 out of pride.\n\n🧠 Hook: pass the baton WITH the map."],
["Tickets","What is an SLA?","Service Level Agreement — the promised clock per priority (e.g., P1: respond 15 min, resolve 4 hrs).\nSLAs decide what you work FIRST.\nA degraded RAID with no hot spare has a real clock even with no customer watching.\n\n🧠 Hook: every ticket wears a stopwatch."],
["Tickets","When can you close a ticket?","Only after VERIFYING the fix (rebuild finished, link stable, user confirms) AND documenting root cause + resolution.\nNever close on 'seems fine' — reopens are the shame stat.\n\n🧠 Hook: closed means PROVEN, not quiet."],
["Tickets","Name common ticketing systems and the metrics queues live by.","Systems: ServiceNow (the enterprise standard), Jira Service Management, Zendesk.\nMetrics: MTTR (mean time to resolution), first-touch resolution, SLA compliance, REOPEN RATE, queue age.\n\n🧠 Hook: know the names, respect the stopwatches."],
["Tickets","You've never used a ticketing system professionally. Honest answer?","\"I haven't worked a professional queue yet, but I know the workflow: intake, triage by impact × urgency, one owner, document everything, escalate with notes, verify before closing. I already work that way — my labs were documented with evidence as I went, and my inventory job was count → flag → record → close.\"\n\n🧠 This converts a gap into proof of understanding. Rehearse it."],
["Tickets","ServiceNow: Incident vs Request vs Problem vs Change?","INCIDENT — something is BROKEN\nREQUEST — someone WANTS something (access, laptop)\nPROBLEM — the ROOT CAUSE behind repeated incidents\nCHANGE — a PLANNED modification with approvals\n\n🧠 Hook: Broke / Want / Why / Plan. Knowing this split is the #1 fluency signal."],
["Tickets","ServiceNow incident states — and why Resolved ≠ Closed?","New → In Progress → On Hold (waiting on user/parts/vendor) → RESOLVED → CLOSED.\nResolved = 'I fixed it.' Closed = user confirmed (or timer expired).\nThe gap between them is where REOPENS live.\n\n🧠 Hook: resolved is your claim; closed is the verdict."],
["Tickets","ServiceNow: work notes vs additional comments?","WORK NOTES = internal, techs only.\nADDITIONAL COMMENTS = visible to the USER.\nNever vent in the wrong box.\nAlso: assignment group = the team queue; assigned-to = the single owner.\n\n🧠 Hook: two boxes — the break room and the front counter."],
["Tickets","What are the KB and CMDB?","KB (Knowledge Base): solved-it-before articles. Search BEFORE troubleshooting; write/update one AFTER solving something new.\nCMDB: the database of every asset — the ticket knows exactly which rack/machine because it links to a CMDB record.\n\n🧠 Hook: KB = the cookbook; CMDB = the map of the kitchen."]
];

let deck = CARDS.map((c,i)=>({day:c[0], q:c[1], a:c[2], known:false, id:i}));
let filter = "All";
let idx = 0;

const tabsEl = document.getElementById('tabs');
["All","Day 1","Day 2","Day 3","Day 4","Tickets"].forEach(t=>{
  const b=document.createElement('button');
  b.className='tab'+(t===filter?' active':'');
  b.textContent=t + (t==="All" ? ` (${deck.length})` : ` (${deck.filter(c=>c.day===t).length})`);
  b.onclick=()=>{filter=t; idx=0; document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); b.classList.add('active'); render();};
  tabsEl.appendChild(b);
});

function visible(){ return deck.filter(c=> (filter==="All"||c.day===filter) && !c.known ); }

function render(){
  const v = visible();
  const card=document.getElementById('card');
  card.classList.remove('flipped');
  const doneEl=document.getElementById('done');
  if(v.length===0){
    document.getElementById('qtext').textContent="🎉";
    document.getElementById('atext').textContent="";
    document.getElementById('tagF').textContent=filter;
    document.getElementById('tagB').textContent=filter;
    document.getElementById('counter').textContent="0 cards left";
    doneEl.style.display='block';
  } else {
    doneEl.style.display='none';
    if(idx>=v.length) idx=0;
    const c=v[idx];
    setTimeout(()=>{
      document.getElementById('qtext').textContent=c.q;
      document.getElementById('atext').textContent=c.a;
      document.getElementById('tagF').textContent=c.day;
      document.getElementById('tagB').textContent=c.day;
    }, 60);
    document.getElementById('counter').textContent=`Card ${idx+1} of ${v.length} remaining (${filter})`;
  }
  const total = deck.filter(c=> filter==="All"||c.day===filter).length;
  const got = total - v.length;
  document.getElementById('stats').innerHTML = `<b class="g">${got} got it</b> · <b class="a">${v.length} to go</b> of ${total}`;
}

function move(d){ const v=visible(); if(!v.length) return; idx=(idx+d+v.length)%v.length; render(); }
function mark(known){
  const v=visible(); if(!v.length) return;
  const c=v[idx];
  if(known){ c.known=true; } else { idx=(idx+1)%v.length; }
  render();
}
function shuffleDeck(){
  for(let i=deck.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [deck[i],deck[j]]=[deck[j],deck[i]]; }
  idx=0; render();
}
render();
</script>
